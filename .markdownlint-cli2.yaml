# markdownlint-cli2 0.24.0 (markdownlint 0.42.0), pinned through the
# markdownlint-cli2-action v25.0.0 used in CI.
config:
  default: true
  MD013: false        # long lines: tables and URLs
  MD033: false        # inline HTML is not used, but allowed
  MD041: false        # first line need not be a top heading in every doc
  MD060: false        # table style rule: rejects the project's table format
  MD038: false        # code spans with meaningful spaces ("  ✘1 · 3s")
  MD024:
    siblings_only: true   # CHANGELOG repeats "### Security" per version
globs:
  - "README.md"
  - "README.es.md"
  - "docs/**/*.md"
  - "SECURITY.md"
  - "CHANGELOG.md"
